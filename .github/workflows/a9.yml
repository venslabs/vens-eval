name: a9

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # vkpi/sets needs scipy, numpy and py_ecc; the extra installs them at the exact pins of pyproject.toml.
      - name: The sets extra
        run: python -m pip install --disable-pip-version-check -e ".[sets]"

      - name: vens v0.6.0, release asset checked against SHA256SUMS
        working-directory: ${{ runner.temp }}
        run: |
          base=https://github.com/venslabs/vens/releases/download/v0.6.0
          curl -fsSLO "$base/SHA256SUMS"
          curl -fsSLO "$base/vens-v0.6.0-linux-amd64.tar.gz"
          echo "d429c9bdd8c486e65210d82456209ad9c24d2f9d89c1dc79f1fd5dd00adda668  SHA256SUMS" | sha256sum -c -
          grep ' vens-v0.6.0-linux-amd64.tar.gz$' SHA256SUMS | sha256sum -c -
          mkdir vens-v0.6.0
          tar -xzf vens-v0.6.0-linux-amd64.tar.gz -C vens-v0.6.0 vens

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: venslabs/vens
          ref: dfa73fd15f695e04dbeacafe581abcf547c02ef2
          path: vens-src
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vens-src/go.mod
          cache-dependency-path: vens-src/go.sum

      - name: vens v0.7.0, built from dfa73fd
        run: make -C vens-src _output/bin/vens

      - name: Tests
        env:
          VKPI_VENS_V060: ${{ runner.temp }}/vens-v0.6.0/vens
          VKPI_VENS_V070: ${{ github.workspace }}/vens-src/_output/bin/vens
          VKPI_E2E_REQUIRED: "1"
        run: python -m unittest discover -s tests -t . -v
